<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
<meta name="theme-color" content="#05070a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rotgrid" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>ROTGRID — Round Based Survival</title>
<link rel="stylesheet" href="./styles/main.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129503;</text></svg>" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/",
    "three/": "./vendor/three/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <!-- ============================ HUD ============================ -->
  <div id="hud" class="layer hidden">
    <div class="hud-corner hud-tl">
      <div class="round-block">
        <div class="round-label">ROUND</div>
        <div class="round-number" id="hud-round">1</div>
      </div>
      <div class="zombies-left"><span id="hud-zleft">0</span> HOSTILES</div>
    </div>

    <div class="hud-corner hud-tr">
      <div class="score-panel">
        <div class="score-name" id="hud-name">OPERATOR</div>
        <div class="score-points" id="hud-points">500</div>
        <div class="score-sub">POINTS</div>
        <div class="score-time" id="hud-time">00:00</div>
      </div>
    </div>

    <div class="hud-corner hud-bl">
      <div class="perk-row" id="hud-perks"></div>
      <div class="vitals">
        <div class="armor-bar"><div class="armor-fill" id="hud-armor-fill"></div></div>
        <div class="health-bar"><div class="health-fill" id="hud-health-fill"></div></div>
      </div>
    </div>

    <div class="hud-corner hud-br">
      <div class="weapon-panel">
        <div class="weapon-name" id="hud-weapon">SIDEARM MK1</div>
        <div class="ammo-line">
          <span class="ammo-mag" id="hud-mag">8</span>
          <span class="ammo-sep">/</span>
          <span class="ammo-res" id="hud-res">80</span>
        </div>
        <div class="weapon-alt" id="hud-weapon-alt"></div>
      </div>
    </div>

    <div class="center-stack">
      <div id="crosshair" class="crosshair">
        <span class="ch t"></span><span class="ch b"></span><span class="ch l"></span><span class="ch r"></span>
        <span class="ch dot"></span>
      </div>
      <div id="hitmarker" class="hitmarker"><span></span><span></span><span></span><span></span></div>
      <div id="prompt" class="prompt hidden"></div>
      <div id="toast-stack" class="toast-stack"></div>
    </div>

    <div id="scope" class="scope hidden">
      <div class="scope-shade"></div>
      <div class="scope-tube">
        <svg class="scope-reticle" viewBox="0 0 400 400" aria-hidden="true">
          <circle class="sr-edge" cx="200" cy="200" r="196" />
          <line class="sr-hair" x1="0" y1="200" x2="164" y2="200" />
          <line class="sr-hair" x1="236" y1="200" x2="400" y2="200" />
          <line class="sr-hair" x1="200" y1="0" x2="200" y2="164" />
          <line class="sr-hair" x1="200" y1="236" x2="200" y2="400" />
          <line class="sr-fine" x1="164" y1="200" x2="236" y2="200" />
          <line class="sr-fine" x1="200" y1="164" x2="200" y2="236" />
          <circle class="sr-dot" cx="200" cy="200" r="2" />
          <g class="sr-mil">
            <circle cx="200" cy="232" r="3" /><circle cx="200" cy="264" r="3" />
            <circle cx="200" cy="296" r="3" /><circle cx="200" cy="328" r="3" />
            <circle cx="168" cy="200" r="3" /><circle cx="136" cy="200" r="3" />
            <circle cx="232" cy="200" r="3" /><circle cx="264" cy="200" r="3" />
          </g>
        </svg>
        <div class="scope-glint"></div>
      </div>
    </div>

    <div id="damage-vignette" class="damage-vignette"></div>
    <div id="dir-indicators" class="dir-indicators"></div>
    <div id="low-health-pulse" class="low-health-pulse"></div>
    <div id="round-banner" class="round-banner"><div class="rb-text">ROUND 1</div><div class="rb-bar"></div></div>
    <div id="powerup-tray" class="powerup-tray"></div>
    <div id="downed-overlay" class="downed-overlay hidden">
      <div class="downed-title">YOU ARE DOWN</div>
      <div class="downed-sub">BLEEDING OUT</div>
      <div class="bleed-bar"><div class="bleed-fill" id="bleed-fill"></div></div>
    </div>
  </div>

  <!-- ============================ MENUS ============================ -->
  <div id="menu-root" class="layer"></div>
  <div id="fade" class="fade"></div>
  <div class="rotate-prompt" id="rotate-prompt">
    <div class="rp-icon">&#128241;</div>
    <div class="rp-text">ROTATE YOUR DEVICE</div>
    <div class="rp-sub">Rotgrid is played in landscape. Turn the phone sideways to deploy.</div>
  </div>
  <div id="loading" class="loading"><div class="loading-inner"><div class="loading-title">ROTGRID</div><div class="loading-bar"><i></i></div><div class="loading-tip">Generating facility…</div></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
