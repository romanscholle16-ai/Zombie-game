<title>ROTGRID — Round-Based Zombie Survival</title>
<style>
/* ROTGRID — original UI theme. No third-party assets. */
:root{
  --bg:#07090a;
  --ink:#e8e6df;
  --dim:#8a8f8c;
  --acid:#9fd93a;
  --acid-dk:#5f8a1e;
  --blood:#c0392b;
  --amber:#e8a33d;
  --steel:#1a1f22;
  --steel-2:#12171a;
  --edge:rgba(159,217,58,.35);
  --hud-font:"Rajdhani","DIN Alternate","Segoe UI Semibold",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--hud-font);letter-spacing:.02em;-webkit-font-smoothing:antialiased;}
body{cursor:default}
body.playing{cursor:none}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}
.hidden{display:none !important}
button{font-family:inherit;color:inherit}

/* ============================ LOADING ============================ */
.loading{position:absolute;inset:0;background:#05070800;background:#050708;display:flex;
  align-items:center;justify-content:center;z-index:200;transition:opacity .5s}
.loading.done{opacity:0;pointer-events:none}
.loading-inner{text-align:center}
.loading-title{font-size:clamp(38px,7vw,90px);font-weight:800;letter-spacing:.32em;
  color:var(--acid);text-shadow:0 0 32px rgba(159,217,58,.35)}
.loading-bar{width:min(420px,60vw);height:3px;background:#1a1f22;margin:22px auto 12px;overflow:hidden}
.loading-bar i{display:block;height:100%;width:35%;background:var(--acid);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
.loading-tip{color:var(--dim);font-size:13px;letter-spacing:.28em;text-transform:uppercase}

/* ============================ FADE ============================ */
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:150;transition:opacity .38s ease}
.fade.on{opacity:1;pointer-events:all}

/* ============================ MENU SHELL ============================ */
#menu-root{pointer-events:none;z-index:100}
#menu-root.active{pointer-events:auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 15% 10%,rgba(8,12,10,.35),rgba(3,5,5,.92));
  animation:scr-in .28s ease both}
@keyframes scr-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen.no-dim{background:linear-gradient(90deg,rgba(3,5,5,.94) 0%,rgba(3,5,5,.72) 42%,rgba(3,5,5,.18) 78%,rgba(3,5,5,0) 100%)}

.vignette-frame{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 220px rgba(0,0,0,.92), inset 0 0 60px rgba(0,0,0,.6)}
.scanlines{position:absolute;inset:0;pointer-events:none;opacity:.16;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.6) 2px 3px)}
.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;
  background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1px);
  background-size:3px 3px;animation:grain 1.2s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}
  50%{transform:translate(1px,-2px)}75%{transform:translate(2px,2px)}100%{transform:translate(0,0)}}

/* ---------------------------- title ---------------------------- */
.brand{padding:clamp(28px,5vh,64px) clamp(30px,6vw,90px) 0}
.brand-title{font-size:clamp(46px,8.4vw,132px);line-height:.86;font-weight:800;letter-spacing:.1em;
  color:#f2f0e8;text-shadow:0 0 40px rgba(0,0,0,.9), 0 6px 0 rgba(0,0,0,.55)}
.brand-title em{font-style:normal;color:var(--acid);text-shadow:0 0 44px rgba(159,217,58,.5)}
.brand-sub{margin-top:10px;color:var(--dim);letter-spacing:.5em;font-size:clamp(10px,1.2vw,15px);
  text-transform:uppercase}
.brand-rule{margin-top:18px;width:min(560px,54vw);height:2px;
  background:linear-gradient(90deg,var(--acid),rgba(159,217,58,0))}

/* ---------------------------- nav list ---------------------------- */
.menu-body{flex:1;display:flex;align-items:center;padding:0 clamp(30px,6vw,90px)}
.menu-list{display:flex;flex-direction:column;gap:2px;min-width:min(400px,46vw)}
.menu-item{position:relative;display:flex;align-items:center;gap:16px;padding:11px 18px 11px 14px;
  background:linear-gradient(90deg,rgba(20,26,24,.72),rgba(20,26,24,0));
  border:0;border-left:2px solid rgba(255,255,255,.08);
  text-align:left;font-size:clamp(15px,1.7vw,22px);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#cfd3cc;cursor:pointer;transition:.14s ease;width:100%}
.menu-item:hover,.menu-item.sel{color:#0a0d08;border-left-color:var(--acid);
  background:linear-gradient(90deg,var(--acid),rgba(159,217,58,.06));transform:translateX(9px)}
.menu-item .idx{font-family:var(--mono);font-size:11px;opacity:.55;min-width:22px}
.menu-item .tag{margin-left:auto;font-size:10px;letter-spacing:.2em;opacity:.6;font-weight:600}
.menu-item.ghost{opacity:.55}
.menu-foot{padding:0 clamp(30px,6vw,90px) clamp(20px,4vh,40px);color:var(--dim);
  font-size:11px;letter-spacing:.24em;display:flex;gap:26px;flex-wrap:wrap;text-transform:uppercase}
.menu-foot b{color:var(--acid);font-weight:700}

/* ---------------------------- panel screens ---------------------------- */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:clamp(22px,4vh,46px) clamp(26px,6vw,90px)}
.panel-head{display:flex;align-items:baseline;gap:18px;
  border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:14px;margin-bottom:20px}
.panel-title{font-size:clamp(24px,3.4vw,44px);font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.panel-title span{color:var(--acid)}
.panel-hint{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.panel-scroll{flex:1;overflow-y:auto;padding-right:10px;scrollbar-width:thin;
  scrollbar-color:var(--acid-dk) transparent}
.panel-scroll::-webkit-scrollbar{width:8px}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--acid-dk)}
.panel-actions{display:flex;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);margin-top:16px}
.btn{padding:11px 26px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);
  letter-spacing:.2em;text-transform:uppercase;font-weight:700;font-size:13px;cursor:pointer;transition:.14s}
.btn:hover{background:var(--acid);color:#08110a;border-color:var(--acid)}
.btn.primary{background:var(--acid);color:#08110a;border-color:var(--acid)}
.btn.primary:hover{filter:brightness(1.14)}
.btn.danger:hover{background:var(--blood);border-color:var(--blood);color:#fff}

/* ---------------------------- settings ---------------------------- */
.set-group{margin-bottom:26px}
.set-group h3{font-size:12px;letter-spacing:.34em;color:var(--acid);text-transform:uppercase;
  margin-bottom:10px;padding-bottom:6px;border-bottom:1px dashed rgba(159,217,58,.25)}
.set-row{display:grid;grid-template-columns:minmax(160px,1.1fr) 2fr minmax(64px,auto);
  gap:16px;align-items:center;padding:8px 6px;border-radius:2px}
.set-row:hover{background:rgba(255,255,255,.035)}
.set-row label{font-size:14px;letter-spacing:.08em;color:#c8ccc4}
.set-row .val{font-family:var(--mono);font-size:13px;color:var(--acid);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:#232a26;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:18px;background:var(--acid);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:18px;background:var(--acid);border:0;cursor:pointer}
select,input[type=text]{background:#12171a;border:1px solid rgba(255,255,255,.16);color:var(--ink);
  padding:7px 10px;font-family:inherit;letter-spacing:.08em;width:100%}
.toggle{position:relative;width:52px;height:24px;background:#232a26;border:1px solid rgba(255,255,255,.14);
  cursor:pointer;transition:.16s}
.toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#6b736c;transition:.16s}
.toggle.on{background:rgba(159,217,58,.22);border-color:var(--acid)}
.toggle.on i{left:30px;background:var(--acid)}
.keybind{background:#12171a;border:1px solid rgba(255,255,255,.16);padding:7px 12px;font-family:var(--mono);
  font-size:12px;cursor:pointer;letter-spacing:.1em;width:100%;text-align:center}
.keybind:hover{border-color:var(--acid);color:var(--acid)}
.keybind.listening{background:var(--acid);color:#08110a;animation:blinkk .6s steps(2) infinite}
@keyframes blinkk{50%{opacity:.45}}

/* ---------------------------- stats ---------------------------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stat-card{background:linear-gradient(140deg,rgba(26,31,34,.9),rgba(12,16,18,.9));
  border:1px solid rgba(255,255,255,.08);border-top:2px solid var(--acid);padding:14px 16px}
.stat-card .k{font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.stat-card .v{font-size:clamp(22px,2.6vw,34px);font-weight:800;color:#f0efe8;margin-top:4px;font-family:var(--mono)}
.stat-card .v.acid{color:var(--acid)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:10px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;
  padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.12)}
.table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--mono);font-size:12.5px}
.table tr:hover td{background:rgba(159,217,58,.05)}

/* ---------------------------- loadout ---------------------------- */
.loadout-wrap{display:grid;grid-template-columns:minmax(210px,270px) 1fr;gap:18px;flex:1;min-height:0}
.wep-list{overflow-y:auto;border-right:1px solid rgba(255,255,255,.08);padding-right:8px;
  scrollbar-width:thin;scrollbar-color:var(--acid-dk) transparent}
.wep-cat{font-size:10px;letter-spacing:.3em;color:var(--acid);text-transform:uppercase;
  margin:14px 0 6px;opacity:.85}
.wep-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:transparent;
  border:0;border-left:2px solid transparent;text-align:left;cursor:pointer;color:#c2c7c0;font-size:13.5px;
  letter-spacing:.06em;transition:.12s}
.wep-btn:hover{background:rgba(255,255,255,.05)}
.wep-btn.sel{background:linear-gradient(90deg,rgba(159,217,58,.2),transparent);
  border-left-color:var(--acid);color:#fff}
.rar{width:7px;height:7px;flex:0 0 auto;transform:rotate(45deg)}
.rar.common{background:#8d948c}.rar.uncommon{background:#5ad07a}
.rar.rare{background:#4aa3ff}.rar.epic{background:#b479ff}.rar.wonder{background:var(--acid);
  box-shadow:0 0 10px var(--acid)}
.wep-detail{display:flex;flex-direction:column;min-height:0}
.wep-view{flex:1;min-height:180px;background:radial-gradient(60% 60% at 50% 55%,rgba(159,217,58,.09),transparent 70%);
  border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}
.wep-view canvas{position:absolute;inset:0;width:100%;height:100%}
.wep-meta{padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin-bottom:7px}
.bar-row .bk{font-size:10.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.bar-track{height:5px;background:#1d2321}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--acid-dk),var(--acid));transition:width .3s}
.bar-row .bv{font-family:var(--mono);font-size:11px;color:#cfd3cc;text-align:right}
.wep-blurb{color:var(--dim);font-size:12.5px;line-height:1.65;letter-spacing:.03em}
.perk-hero{display:flex;align-items:center;gap:16px;padding-bottom:14px;margin-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,.08)}
.perk-badge{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:24px;font-weight:800;
  color:var(--pk);border:2px solid var(--pk);background:rgba(0,0,0,.45);
  box-shadow:0 0 22px -6px var(--pk),inset 0 0 14px -6px var(--pk)}
.perk-points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.perk-points li{position:relative;padding-left:16px;color:var(--dim);
  font-size:12.5px;line-height:1.55;letter-spacing:.03em}
.perk-points li::before{content:'';position:absolute;left:0;top:.55em;
  width:6px;height:6px;background:var(--acid);transform:rotate(45deg);opacity:.8}
.wep-title{font-size:clamp(20px,2.4vw,30px);font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.wep-sub{color:var(--dim);font-size:11px;letter-spacing:.26em;text-transform:uppercase;margin-top:3px}

/* ---------------------------- credits ---------------------------- */
.credits-scroll{line-height:2;font-size:14px;color:#c6cac2;max-width:760px}
.credits-scroll h4{color:var(--acid);font-size:11px;letter-spacing:.34em;text-transform:uppercase;margin:22px 0 4px}
.credits-scroll p{margin:0;letter-spacing:.05em}
.credits-scroll .small{font-size:12px;color:var(--dim);line-height:1.8}

/* ---------------------------- pause ---------------------------- */
.pause-wrap{position:absolute;inset:0;background:rgba(3,5,5,.82);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.pause-title{font-size:clamp(28px,4vw,54px);font-weight:800;letter-spacing:.4em;color:var(--acid)}

/* ---------------------------- game over ---------------------------- */
.go-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:radial-gradient(80% 70% at 50% 40%,rgba(60,8,8,.5),rgba(2,3,3,.96))}
.go-title{font-size:clamp(44px,9vw,140px);font-weight:800;letter-spacing:.14em;color:#d34a3c;
  text-shadow:0 0 60px rgba(200,40,30,.55);animation:go-in .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes go-in{from{opacity:0;transform:scale(1.3) translateY(-14px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.go-sub{color:var(--dim);letter-spacing:.42em;font-size:12px;text-transform:uppercase;margin-bottom:10px}
.go-stats{display:grid;grid-template-columns:repeat(3,minmax(140px,190px));gap:10px;margin-bottom:8px}
.go-stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:12px 14px;text-align:center}
.go-stat .k{font-size:9.5px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase}
.go-stat .v{font-family:var(--mono);font-size:26px;font-weight:700;margin-top:3px}
.go-new{color:var(--amber);font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  animation:blinkk 1s steps(2) infinite}

/* ============================ HUD ============================ */
#hud{z-index:40;font-family:var(--hud-font)}
.hud-corner{position:absolute;padding:clamp(14px,2.2vh,26px) clamp(16px,2.4vw,34px)}
.hud-tl{top:0;left:0}.hud-tr{top:0;right:0;text-align:right}
.hud-bl{bottom:0;left:0}.hud-br{bottom:0;right:0;text-align:right}

.round-block{display:flex;align-items:baseline;gap:10px}
.round-label{font-size:11px;letter-spacing:.42em;color:var(--dim)}
.round-number{font-size:clamp(30px,4.4vw,58px);font-weight:800;line-height:.9;color:var(--blood);
  text-shadow:0 0 26px rgba(190,50,40,.45)}
.zombies-left{margin-top:2px;font-size:11px;letter-spacing:.26em;color:#8d9389}
.zombies-left span{color:var(--acid);font-family:var(--mono)}

.score-panel .score-name{font-size:11px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.score-points{font-size:clamp(24px,3.2vw,42px);font-weight:800;color:var(--acid);line-height:1;
  font-family:var(--mono);text-shadow:0 0 22px rgba(159,217,58,.3);transition:transform .1s}
.score-points.bump{transform:scale(1.14)}
.score-sub{font-size:9.5px;letter-spacing:.36em;color:var(--dim)}
.score-time{margin-top:6px;font-family:var(--mono);font-size:14px;color:#b9bdb4}

.vitals{width:min(300px,32vw)}
.health-bar,.armor-bar{height:9px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);
  overflow:hidden;margin-top:5px}
.armor-bar{height:5px}
.health-fill{height:100%;width:100%;background:linear-gradient(90deg,#8fd13f,#d9e85a);transition:width .12s linear}
.health-fill.hurt{background:linear-gradient(90deg,#c0392b,#e8703d)}
.armor-fill{height:100%;width:0%;background:linear-gradient(90deg,#4aa3ff,#9fd6ff);transition:width .12s linear}
.perk-row{display:flex;gap:7px;margin-bottom:9px;min-height:38px;align-items:flex-end}
.perk-chip{width:38px;height:38px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:15px;background:rgba(10,14,12,.7);
  animation:perk-pop .45s cubic-bezier(.2,1.5,.4,1) both;position:relative}
@keyframes perk-pop{from{transform:scale(0) rotate(-25deg)}to{transform:none}}
.perk-chip::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 12px currentColor;opacity:.5}

.weapon-panel .weapon-name{font-size:13px;letter-spacing:.22em;color:#d4d8d0;text-transform:uppercase}
.ammo-line{display:flex;align-items:baseline;gap:6px;justify-content:flex-end;font-family:var(--mono)}
.ammo-mag{font-size:clamp(28px,3.8vw,48px);font-weight:700;line-height:1}
.ammo-mag.low{color:var(--blood);animation:blinkk .5s steps(2) infinite}
.ammo-sep{color:var(--dim);font-size:20px}
.ammo-res{font-size:20px;color:#9aa096}
.weapon-alt{font-size:10.5px;letter-spacing:.2em;color:var(--acid);min-height:14px;text-transform:uppercase}

.center-stack{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
/* ---------------------------------------------------------------- scope
   Magnified optics get a real sight picture: a black surround with a round
   tube cut out of it, a reticle etched on the glass, and a touch of edge
   distortion. Drawn in the DOM so the etching stays sharp at any resolution. */
.scope{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:6}
.scope.hidden{display:none}
.scope-shade{position:absolute;inset:-2px;background:#000}
/* The cut-out is a mask so the shade really is opaque everywhere else. */
.scope-shade{
  -webkit-mask:radial-gradient(circle at 50% 50%,
    transparent 0, transparent calc(var(--scope-r) - 1px),
    #000 calc(var(--scope-r) + 1px), #000 100%);
  mask:radial-gradient(circle at 50% 50%,
    transparent 0, transparent calc(var(--scope-r) - 1px),
    #000 calc(var(--scope-r) + 1px), #000 100%);
}
.scope-tube{
  position:absolute;left:50%;top:50%;
  width:calc(var(--scope-r) * 2);height:calc(var(--scope-r) * 2);
  transform:translate(-50%,-50%) translate(var(--scope-x,0px),var(--scope-y,0px));
  border-radius:50%;
  box-shadow:inset 0 0 40px 12px rgba(0,0,0,.85),inset 0 0 6px 2px rgba(150,190,120,.12);
}
.scope-reticle{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sr-edge{fill:none;stroke:rgba(0,0,0,.55);stroke-width:8}
.sr-hair{stroke:#0b0f0a;stroke-width:5;stroke-linecap:butt}
.sr-fine{stroke:#0b0f0a;stroke-width:1.5}
.sr-dot{fill:#0b0f0a}
.sr-mil circle{fill:#0b0f0a}
/* A faint sliver of light across the glass, the way a real objective flares. */
.scope-glint{
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(118deg,rgba(190,220,255,.10) 0%,rgba(190,220,255,0) 34%);
}

.crosshair{position:relative;width:36px;height:36px;opacity:.95;transition:transform .08s}
.crosshair .ch{position:absolute;background:#eaf4dd;box-shadow:0 0 3px rgba(0,0,0,.9)}
.crosshair .t,.crosshair .b{width:2px;height:8px;left:17px}
.crosshair .t{top:0}.crosshair .b{bottom:0}
.crosshair .l,.crosshair .r{height:2px;width:8px;top:17px}
.crosshair .l{left:0}.crosshair .r{right:0}
.crosshair .dot{width:2px;height:2px;left:17px;top:17px;opacity:.85}
.crosshair.ads{transform:scale(.55);opacity:.5}
.crosshair.hidden-ch{opacity:0}

.hitmarker{position:absolute;width:26px;height:26px;opacity:0}
.hitmarker span{position:absolute;width:9px;height:2px;background:#fff;box-shadow:0 0 4px #000}
.hitmarker span:nth-child(1){top:4px;left:2px;transform:rotate(45deg)}
.hitmarker span:nth-child(2){top:4px;right:2px;transform:rotate(-45deg)}
.hitmarker span:nth-child(3){bottom:4px;left:2px;transform:rotate(-45deg)}
.hitmarker span:nth-child(4){bottom:4px;right:2px;transform:rotate(45deg)}
.hitmarker.show{animation:hm .22s ease-out}
.hitmarker.crit span{background:#ff5a45;height:3px}
.hitmarker.kill span{background:var(--acid)}
@keyframes hm{0%{opacity:1;transform:scale(.55)}100%{opacity:0;transform:scale(1.35)}}

.prompt{position:absolute;top:calc(50% + 62px);left:50%;transform:translateX(-50%);
  background:rgba(6,9,8,.82);border:1px solid rgba(159,217,58,.4);padding:9px 18px;
  text-align:center;min-width:210px;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.prompt .pk{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 5px;background:var(--acid);color:#0a1108;font-weight:800;font-size:12px;margin-right:9px}
.prompt .pt{font-size:14px;letter-spacing:.13em;text-transform:uppercase}
.prompt .pc{display:block;margin-top:3px;font-family:var(--mono);font-size:12px;color:var(--acid)}
.prompt .pd{display:block;margin-top:4px;max-width:340px;font-size:11px;line-height:1.45;
  letter-spacing:.05em;color:rgba(226,236,214,.72);text-transform:none}
.prompt.deny{border-color:var(--blood);animation:shakep .3s}
.prompt.deny .pc{color:var(--blood)}
@keyframes shakep{25%{transform:translateX(-50%) translateX(-6px)}75%{transform:translateX(-50%) translateX(6px)}}
.hold-ring{display:block;margin-top:6px;height:3px;background:rgba(255,255,255,.14)}
.hold-ring i{display:block;height:100%;background:var(--acid);width:0}

.toast-stack{position:absolute;top:calc(50% - 150px);left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;width:420px}
.toast{font-size:15px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;
  text-shadow:0 2px 10px #000;animation:toast .1s ease-out both}
.toast.fade{animation:toast-out .5s ease-in forwards}
@keyframes toast{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(-14px)}}
.toast.pts{color:var(--acid)}.toast.warn{color:var(--amber)}.toast.bad{color:var(--blood)}
.toast.big{font-size:22px;letter-spacing:.3em}

.damage-vignette{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(120% 100% at 50% 50%,transparent 40%,rgba(150,10,10,.85) 100%);
  transition:opacity .32s ease}
.low-health-pulse{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(130% 110% at 50% 50%,transparent 30%,rgba(120,0,0,.9) 100%)}
.low-health-pulse.on{animation:lhp 1.35s ease-in-out infinite}
@keyframes lhp{0%,100%{opacity:.22}50%{opacity:.62}}

.dir-indicators{position:absolute;inset:0}
.dir-ind{position:absolute;top:50%;left:50%;width:0;height:0;transform-origin:0 0}
.dir-ind i{display:block;position:absolute;width:0;height:0;transform:translate(-50%,-50%) translateY(-108px);
  border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:26px solid rgba(230,50,40,.85);
  filter:drop-shadow(0 0 6px rgba(0,0,0,.8))}

.round-banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;pointer-events:none}
.round-banner .rb-text{font-size:clamp(40px,8vw,120px);font-weight:800;letter-spacing:.24em;
  color:#e2ded2;text-shadow:0 0 60px rgba(190,40,30,.6)}
.round-banner .rb-bar{width:0;height:3px;background:var(--blood);margin-top:10px}
.round-banner.show .rb-text{animation:rb-t 2.6s cubic-bezier(.2,.9,.2,1) both}
.round-banner.show .rb-bar{animation:rb-b 2.6s cubic-bezier(.2,.9,.2,1) both}
.round-banner.show{opacity:1}
@keyframes rb-t{0%{opacity:0;transform:scale(1.6);filter:blur(16px)}
  18%{opacity:1;transform:scale(1);filter:blur(0)}75%{opacity:1}100%{opacity:0;transform:scale(.94)}}
@keyframes rb-b{0%{width:0;opacity:0}20%{width:min(420px,52vw);opacity:1}75%{width:min(420px,52vw);opacity:1}100%{width:0;opacity:0}}

.powerup-tray{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;gap:10px}
.pu-chip{display:flex;align-items:center;gap:8px;padding:5px 12px;background:rgba(6,9,8,.75);
  border:1px solid currentColor;font-size:11px;letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.pu-chip .pu-t{font-family:var(--mono);opacity:.85}
.pu-chip.expiring{animation:blinkk .4s steps(2) infinite}

.downed-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding-bottom:22vh;gap:8px;
  background:radial-gradient(90% 70% at 50% 70%,rgba(90,0,0,.3),rgba(0,0,0,.75))}
.downed-title{font-size:clamp(26px,4vw,52px);font-weight:800;letter-spacing:.3em;color:#d34a3c}
.downed-sub{font-size:11px;letter-spacing:.4em;color:var(--dim);text-transform:uppercase}
.bleed-bar{width:min(340px,50vw);height:5px;background:rgba(255,255,255,.12);margin-top:6px}
.bleed-fill{height:100%;width:100%;background:var(--blood)}

/* ============================ misc ============================ */
.kbd{display:inline-block;min-width:20px;padding:1px 6px;border:1px solid rgba(255,255,255,.28);
  border-bottom-width:2px;font-family:var(--mono);font-size:11px;border-radius:2px;color:#d6dad2}
.mp-note{max-width:660px;color:#c0c5bd;line-height:1.85;font-size:14px}
.mp-note code{font-family:var(--mono);color:var(--acid);font-size:12.5px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.slot{border:1px dashed rgba(255,255,255,.18);padding:16px;text-align:center;color:var(--dim)}
.slot.me{border-style:solid;border-color:var(--acid);color:var(--ink)}
.slot .s1{font-size:10px;letter-spacing:.3em;text-transform:uppercase}
.slot .s2{font-size:17px;font-weight:700;margin-top:6px;letter-spacing:.1em}
@media (max-width:820px){
  .loadout-wrap{grid-template-columns:1fr}
  .wep-list{max-height:34vh;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}
  .set-row{grid-template-columns:1fr 1.4fr 52px}
  .go-stats{grid-template-columns:repeat(2,1fr)}
}
